spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/votacao_db
    username: postgres
    password: 7654321
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway controla o schema, não o Hibernate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.votacao: DEBUG
    org.hibernate.SQL: DEBUG